services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve"]
    volumes:
      - ./config:/app/config:ro
      - server-data:/app/data

  survival-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve"]
    volumes:
      - ./config:/app/config:ro
      - survival-server-data:/app/data

  smp-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve"]
    volumes:
      - ./config/verify/smp-server.json:/app/config/server.json:ro
      - smp-server-data:/app/data

  survival-vitals-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve"]
    volumes:
      - ./config/verify/smp-server.json:/app/config/server.json:ro
      - survival-vitals-server-data:/app/data

  scale-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve"]
    volumes:
      - ./config/verify/scale-server.json:/app/config/server.json:ro
      - scale-server-data:/app/data

  session-fixture:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["fixture", "session-server", "--bind", "0.0.0.0:25566"]

  online-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve"]
    volumes:
      - ./config/verify/online-server.json:/app/config/server.json:ro
      - online-server-data:/app/data
    depends_on:
      - session-fixture

  verify:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target

  smoke:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - server
    entrypoint: ["cargo", "run", "--", "probe", "login-play", "--host", "server:25565"]

  profile-reconnect:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - server
    entrypoint: ["cargo", "run", "--", "probe", "profile-reconnect", "--host", "server:25565"]

  chunk-stream:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - server
    entrypoint: ["cargo", "run", "--", "probe", "chunk-stream", "--host", "server:25565"]

  scale-chunk-stream:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - scale-server
    entrypoint: ["cargo", "run", "--", "probe", "scale-chunk-stream", "--host", "scale-server:25565"]

  persist-place:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - server
    entrypoint: ["cargo", "run", "--", "probe", "persist-place", "--host", "server:25565"]

  persist-check:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - server
    entrypoint: ["cargo", "run", "--", "probe", "persist-check", "--host", "server:25565"]

  survival-item:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - survival-server
    entrypoint: ["cargo", "run", "--", "probe", "survival-item", "--host", "survival-server:25565"]

  inventory-sync:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - survival-server
    entrypoint: ["cargo", "run", "--", "probe", "inventory-sync", "--host", "survival-server:25565"]

  item-pickup:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - survival-server
    entrypoint: ["cargo", "run", "--", "probe", "item-pickup", "--host", "survival-server:25565"]

  survival-vitals:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - survival-vitals-server
    entrypoint: ["cargo", "run", "--", "probe", "survival-vitals", "--host", "survival-vitals-server:25565"]

  smp-commands:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - smp-server
    entrypoint: ["cargo", "run", "--", "probe", "smp-commands", "--host", "smp-server:25565"]

  online-auth:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
