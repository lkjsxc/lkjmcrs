services:
  survival-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve"]
    volumes:
      - ./config:/app/config:ro
      - survival-server-data:/app/data

  smp-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve"]
    volumes:
      - ./config/verify/smp-server.json:/app/config/server.json:ro
      - smp-server-data:/app/data

  verify:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target

  smoke:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - server
    entrypoint: ["cargo", "run", "--", "probe", "multiplayer-mutation", "--host", "server:25565"]

  profile-reconnect:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - server
    entrypoint: ["cargo", "run", "--", "probe", "profile-reconnect", "--host", "server:25565"]

  chunk-stream:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - server
    entrypoint: ["cargo", "run", "--", "probe", "chunk-stream", "--host", "server:25565"]

  persist-place:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - server
    entrypoint: ["cargo", "run", "--", "probe", "persist-place", "--host", "server:25565"]

  persist-check:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - server
    entrypoint: ["cargo", "run", "--", "probe", "persist-check", "--host", "server:25565"]

  survival-item:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - survival-server
    entrypoint: ["cargo", "run", "--", "probe", "survival-item", "--host", "survival-server:25565"]

  inventory-sync:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - survival-server
    entrypoint: ["cargo", "run", "--", "probe", "inventory-sync", "--host", "survival-server:25565"]

  item-pickup:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - survival-server
    entrypoint: ["cargo", "run", "--", "probe", "item-pickup", "--host", "survival-server:25565"]

  smp-commands:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - smp-server
    entrypoint: ["cargo", "run", "--", "probe", "smp-commands", "--host", "smp-server:25565"]

volumes:
  cargo-registry:
  target-cache:
  survival-server-data:
  smp-server-data:
