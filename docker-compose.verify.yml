      dockerfile: Dockerfile
    command: ["serve"]
    volumes:
      - ./config/verify/render32-server.json:/app/config/server.json:ro
      - render32-server-data:/app/data

  session-fixture:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["fixture", "session-server", "--bind", "0.0.0.0:25566"]

  online-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve"]
    volumes:
      - ./config/verify/online-server.json:/app/config/server.json:ro
      - online-server-data:/app/data
    depends_on:
      - session-fixture

  verify:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target

  smoke:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      - server
    entrypoint: ["cargo", "run", "--", "probe", "login-play", "--host", "server:25565"]

  profile-reconnect:
