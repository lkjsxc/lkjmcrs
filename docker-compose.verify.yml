services:
  survival-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve", "--config", "config/survival.json"]
    volumes:
      - survival-server-data:/data
    healthcheck:
      test: ["CMD", "lkjmcrs", "probe", "status", "--host", "127.0.0.1:25565"]
      interval: 5s
      timeout: 5s
      retries: 20

  smp-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve", "--config", "config/smp.json"]
    volumes:
      - smp-server-data:/data
    healthcheck:
      test: ["CMD", "lkjmcrs", "probe", "status", "--host", "127.0.0.1:25565"]
      interval: 5s
      timeout: 5s
      retries: 20

  verify:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target

  smoke:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      server:
        condition: service_healthy
    entrypoint: ["cargo", "run", "--", "probe", "multiplayer-mutation", "--host", "server:25565"]

  profile-reconnect:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      server:
        condition: service_healthy
    entrypoint: ["cargo", "run", "--", "probe", "profile-reconnect", "--host", "server:25565"]

  chunk-stream:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      server:
        condition: service_healthy
    entrypoint: ["cargo", "run", "--", "probe", "chunk-stream", "--host", "server:25565"]

  persist-place:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      server:
        condition: service_healthy
    entrypoint: ["cargo", "run", "--", "probe", "persist-place", "--host", "server:25565"]

  persist-check:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      server:
        condition: service_healthy
    entrypoint: ["cargo", "run", "--", "probe", "persist-check", "--host", "server:25565"]

  survival-item:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      survival-server:
        condition: service_healthy
    entrypoint: ["cargo", "run", "--", "probe", "survival-item", "--host", "survival-server:25565"]

  inventory-sync:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      survival-server:
        condition: service_healthy
    entrypoint: ["cargo", "run", "--", "probe", "inventory-sync", "--host", "survival-server:25565"]

  item-pickup:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      survival-server:
        condition: service_healthy
    entrypoint: ["cargo", "run", "--", "probe", "item-pickup", "--host", "survival-server:25565"]

  smp-commands:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/target
    depends_on:
      smp-server:
        condition: service_healthy
    entrypoint: ["cargo", "run", "--", "probe", "smp-commands", "--host", "smp-server:25565"]

volumes:
  cargo-registry:
  target-cache:
  survival-server-data:
  smp-server-data:
