    entrypoint: ["cargo", "run", "--", "probe", "online-auth", "--host", "online-server:25565"]

volumes:
  cargo-registry:
  target-cache:
  server-data:
  survival-server-data:
  survival-vitals-server-data:
  scale-server-data:
  smp-server-data:
  online-server-data:
