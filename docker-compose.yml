name: lkjmcrs

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve", "--config", "config/default.json"]
    volumes:
      - server-data:/app/data
    ports:
      - "${HOST_PORT:-25565}:25565"
    healthcheck:
      test: ["CMD", "lkjmcrs", "probe", "status", "--host", "127.0.0.1:25565"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  server-data:
